name: Open pack version update

on:
  repository_dispatch:
    types: [voicepack-published, characterpack-published]

permissions:
  contents: write
  pull-requests: write

jobs:
  open-version-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate event payload
        id: payload
        env:
          EVENT_TYPE: ${{ github.event.action }}
          VERSION: ${{ github.event.client_payload.version }}
        shell: bash
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          case "$EVENT_TYPE" in
            voicepack-published) echo "property=drivepersona.voicepack.version" >> "$GITHUB_OUTPUT" ;;
            characterpack-published) echo "property=drivepersona.characterpack.version" >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create a version update branch
        env:
          PROPERTY: ${{ steps.payload.outputs.property }}
          VERSION: ${{ steps.payload.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          branch="automation/${PROPERTY##*.}-${VERSION}"
          git config user.name "drivepersona-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          sed -i "s/^${PROPERTY}=.*/${PROPERTY}=${VERSION}/" android/gradle.properties
          git add android/gradle.properties
          git commit -m "chore(packs): update ${PROPERTY} to ${VERSION}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(packs): update ${PROPERTY} to ${VERSION}" \
            --body "Automated update after the private package CI published ${VERSION}. The protected internal Android workflow validates this change after merge."
