name: Public review CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web-simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test

  internal-android:
    # Never expose private package credentials to pull requests. This job runs
    # only after reviewed code reaches the protected default branch.
    # Enable only after the `internal-build` environment contains the two
    # package credentials and the private SDKs have published the pinned version.
    if: github.event_name == 'push' && vars.INTERNAL_PACKAGES_ENABLED == 'true'
    needs: web-simulator
    runs-on: ubuntu-latest
    environment: internal-build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x android/gradlew
      - run: ./gradlew :app:testInternalDebugUnitTest :app:assembleInternalRelease
        working-directory: android
        env:
          GITHUB_ACTOR: ${{ secrets.DRIVEPERSONA_PACKAGES_USER }}
          GITHUB_TOKEN: ${{ secrets.DRIVEPERSONA_PACKAGES_TOKEN }}
