# -Dfile.encoding=UTF-8은 일부러 뺐다. 한글 Windows(MS949)에서 프로젝트 경로에 한글이 있으면 단위 테스트 JVM이
# 클래스를 못 찾는다(ClassNotFoundException). 데몬과 테스트 JVM의 기본 인코딩이 달라져 경로가 깨지기 때문이다.
org.gradle.jvmargs=-Xmx2048m
# 파일 감시(VFS watch)를 끈다. 한글 경로에서 소스를 고쳐도 packageDebug가 'UP-TO-DATE'로 건너뛰어 옛 APK가 남는 일이 있었다.
org.gradle.vfs.watch=false
android.useAndroidX=true
android.nonTransitiveRClass=true
# 프로젝트 경로에 한글이 있으면(예: Pleos앱개발) Windows에서 AGP가 빌드를 막는다 — 검사를 끈다
android.overridePathCheck=true
drivepersona.voicepack.version=0.1.0
drivepersona.characterpack.version=0.1.0
